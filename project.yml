name: Whisperly
options:
  bundleIdPrefix: ai.dxy
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: D8F9APCM27
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Whisperly:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - Whisperly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.dxy.Whisperly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Whisperly/Whisperly.entitlements
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Whisperly records meetings 100% on-device. Your audio never leaves your Mac, iPad, or iPhone."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Used to transcribe your meeting audio entirely on-device."
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.productivity"
        GENERATE_INFOPLIST_FILE: YES
    scheme:
      testTargets:
        - WhisperlyTests
      storeKitConfiguration: Whisperly/StoreKit/Whisperly.storekit

  WhisperlyTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - WhisperlyTests
    dependencies:
      - target: Whisperly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.dxy.WhisperlyTests
        GENERATE_INFOPLIST_FILE: YES
